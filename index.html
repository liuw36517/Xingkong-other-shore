<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>亚洲第一猛男</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    background:#050505;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:"Microsoft YaHei",Arial,sans-serif;
}


.container{
    width:90%;
    max-width:700px;
    text-align:center;
}


.photo{
    width:100%;
    max-height:500px;
    object-fit:cover;
    border-radius:25px;
    box-shadow:0 0 40px rgba(255,255,255,0.15);
}


h1{
    margin-top:35px;
    font-size:48px;
    letter-spacing:5px;
}


p{
    margin-top:20px;
    color:#aaa;
    font-size:18px;
    line-height:2;
}


.button{
    display:inline-block;
    margin-top:35px;
    padding:15px 45px;
    border:1px solid white;
    border-radius:50px;
    color:white;
    text-decoration:none;
    transition:.3s;
}


.button:hover{
    background:white;
    color:black;
}

</style>

</head>


<body>

<div class="container">

    <!-- 把 photo.jpg 换成你的图片名字 -->
    <img class="photo" src="photo.jpg">


    <h1>亚洲第一猛男</h1>


    <p>
    不只是力量的象征<br>
    更是一种态度与精神
    </p>


    <a class="button" href="#">
    进入主页
    </a>


</div>


</body>
</html>
